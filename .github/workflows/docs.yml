name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # Artifact upload/download use the runtime token, not GITHUB_TOKEN permissions.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doxygen:
    name: Build Doxygen documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.5

      - name: Set up vcpkg (Boost is required at configure time)
        uses: lukka/run-vcpkg@v11.6
        with:
          runVcpkgInstall: true
          doNotCache: false

      - name: Configure with documentation enabled
        run: cmake --preset release -DDATADOG_BUILD_DOCS=ON -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Generate documentation (target 'docs')
        run: cmake --build --preset release --target docs

      - name: Upload documentation artifact (all triggers, incl. pull requests)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-docs
          path: build/release/docs/api
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    # Publish only from main; pull requests only build the artifact above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: doxygen
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v7
        with:
          name: doxygen-docs
          path: docs-site

      - uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
