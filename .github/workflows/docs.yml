name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # Artifact upload/download use the runtime token, not GITHUB_TOKEN permissions.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doxygen:
    name: Build Doxygen documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Install CMake
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a  # v4.4.5

      - name: Set up vcpkg (Boost is required at configure time)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          runVcpkgInstall: true
          doNotCache: false

      - name: Configure with documentation enabled
        run: cmake --preset release -DDATADOG_BUILD_DOCS=ON -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Generate documentation (target 'docs')
        run: cmake --build --preset release --target docs

      - name: Upload documentation artifact (all triggers, incl. pull requests)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: doxygen-docs
          # Doxygen writes HTML under <OUTPUT_DIRECTORY>/html (HTML_OUTPUT default),
          # i.e. build/release/docs/api/html — upload that dir so its root is index.html.
          path: build/release/docs/api/html
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    # Publish only from main; pull requests only build the artifact above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: doxygen
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: doxygen-docs
          path: docs-site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: docs-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
