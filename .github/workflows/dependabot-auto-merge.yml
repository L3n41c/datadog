name: Dependabot auto-approve and auto-merge

# Acts only on same-repo pull requests opened by Dependabot. For runs
# triggered by dependabot[bot], GITHUB_TOKEN is read-only by default; the
# explicit `permissions` below raise it for these two scopes (see "Change
# GITHUB_TOKEN permissions for Dependabot workflows" in the GitHub docs),
# which is required to approve and merge. No checkout of the PR head is ever
# performed, so nothing from the PR can influence this workflow's code.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false
    steps:
      - name: Approve the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --merge "$PR_URL"
