name: Dependabot auto-approve and auto-merge

# Acts only on same-repo pull requests opened by Dependabot. For runs
# triggered by dependabot[bot], GITHUB_TOKEN is read-only by default; the
# explicit `permissions` below raise it for these two scopes (see "Change
# GITHUB_TOKEN permissions for Dependabot workflows" in the GitHub docs),
# which is required to approve and merge. No checkout of the PR head is ever
# performed, so nothing from the PR can influence this workflow's code.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          approved=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --jq '[.[] | select(.state == "APPROVED" and .user.login == "github-actions[bot]")] | length')
          if [ "$approved" -gt 0 ]; then
            echo "already approved by github-actions[bot]"
          else
            gh pr review --approve "$PR_URL"
          fi

      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          echo "update-type=${UPDATE_TYPE:-unknown} dependencies=${DEPS:-unknown}"
          # The ruleset on `main` now declares the CI jobs as required status
          # checks (strict_required_status_checks_policy: false), so `--auto`
          # merges only once they are all green and every other rule
          # (signatures, resolved review threads, ...) is satisfied.
          gh pr merge --auto --squash "$PR_URL"
