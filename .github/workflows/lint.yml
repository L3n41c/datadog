name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # reviewdog publishes actionlint findings as a PR/check annotation.
  checks: write
  pull-requests: write

concurrency:
  # pull_request runs share a per-PR group (superseded runs are cancelled);
  # other events get a per-run group so push runs on main are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Check C++ formatting
        run: >-
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx'
          | xargs -0 -r clang-format --dry-run --Werror --style=file

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      # Unversioned names: ubuntu-26.04 defaults to clang 21 (C++26-capable).
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Install CMake
        uses: lukka/get-cmake@a1a8216777d3cbbf5602c73b9ddd3e98257ecdc4  # v4.5.1
      - name: Set up vcpkg (for Boost/GTest include paths in compile_commands.json)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          runVcpkgInstall: true
          doNotCache: false
      - name: Configure (produces compile_commands.json for clang-tidy)
        # CMAKE_CXX_SCAN_FOR_MODULES=OFF: CMake 4.x scans for C++ modules by default and
        # injects -fmodule-mapper=@<file>.modmap flags that clang-tidy cannot resolve.
        run: cmake --preset dev -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Run clang-tidy (config has WarningsAsErrors '*')
        run: |
          find src -type f \( -name '*.cpp' -o -name '*.cxx' -o -name '*.cc' -o -name '*.h' -o -name '*.hpp' \) -print0 \
            | xargs -0 -r -P "$(nproc)" clang-tidy -p build/dev

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4  # v1.84.1
        with:
          # github-pr-check = the action's default reporter (check run on the PR/commit).
          reporter: github-pr-check
          filter_mode: nofilter
          fail_level: error

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3
        with:
          file_or_dir: .
          config_file: .github/.yamllint.yaml

  editorconfig:
    name: editorconfig-checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Check files against .editorconfig
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393  # v3.0.0

  cmake-lint:
    name: cmake-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
      - name: Install cmakelang (pinned in requirements-lint.txt, updated by Dependabot)
        run: python -m pip install -r .github/requirements-lint.txt
      - name: Lint CMake files
        run: |
          git ls-files -z -- 'CMakeLists.txt' '**/CMakeLists.txt' '*.cmake' \
            | xargs -0 -r cmake-format --check -c .cmake-format.yaml --
          git ls-files -z -- 'CMakeLists.txt' '**/CMakeLists.txt' '*.cmake' \
            | xargs -0 -r cmake-lint -c .cmake-format.yaml --

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25
        with:
          # Absolute, non-hidden path: markdownlint-cli2 resolves --config as a glob,
          # which skips dotfiles/dot-directories (e.g. .github/...).
          config: ${{ github.workspace }}/markdownlint-cli2.jsonc
          globs: '**/*.md'
