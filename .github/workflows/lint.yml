name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # reviewdog publishes actionlint findings as a PR/check annotation.
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check C++ formatting with clang-format 20
        uses: DoozyX/clang-format-lint-action@v0.20
        with:
          source: .
          exclude: build
          extensions: c,h,C,H,cpp,hpp,cc,hh,c++,h++,cxx,hxx
          clangFormatVersion: "20"

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      # Unversioned names: ubuntu-26.04 defaults to clang 21 (C++26-capable).
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install CMake
        uses: lukka/get-cmake@v4.4.5
      - name: Set up vcpkg (for Boost/GTest include paths in compile_commands.json)
        uses: lukka/run-vcpkg@v11.6
        with:
          runVcpkgInstall: true
          doNotCache: false
      - name: Configure (produces compile_commands.json for clang-tidy)
        # CMAKE_CXX_SCAN_FOR_MODULES=OFF: CMake 4.x scans for C++ modules by default and
        # injects -fmodule-mapper=@<file>.modmap flags that clang-tidy cannot resolve.
        run: cmake --preset dev -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      # clang-tidy-22 = newest clang-tidy on the ubuntu-26.04 image (the .clang-tidy
      # config targets recent checks); bump together with runs-on. Not a 'uses:'
      # ref, so Dependabot does not manage it.
      - name: Run clang-tidy (config has WarningsAsErrors '*')
        run: |
          find src -type f \( -name '*.cpp' -o -name '*.cxx' -o -name '*.cc' -o -name '*.h' -o -name '*.hpp' \) -print0 \
            | xargs -0 -r -P "$(nproc)" clang-tidy-22 -p build/dev

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@v1.81.1
        with:
          # github-pr-check = the action's default reporter (check run on the PR/commit).
          reporter: github-pr-check
          filter_mode: nofilter
          fail_level: error

  yamllint:
    name: yamllint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .github/.yamllint.yaml

  editorconfig:
    name: editorconfig-checker
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check files against .editorconfig
        uses: editorconfig-checker/action-editorconfig-checker@v3.0.0

  cmake-lint:
    name: cmake-lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Install cmakelang (pinned in requirements-lint.txt, updated by Dependabot)
        run: python -m pip install -r .github/requirements-lint.txt
      - name: Lint CMake files
        run: git ls-files 'CMakeLists.txt' '*.cmake' | xargs cmake-lint -c .cmake-format.yaml

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          # Absolute, non-hidden path: markdownlint-cli2 resolves --config as a glob,
          # which skips dotfiles/dot-directories (e.g. .github/...).
          config: ${{ github.workspace }}/markdownlint-cli2.jsonc
          globs: '**/*.md'
