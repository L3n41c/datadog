name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analysis (cpp)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      # Unversioned names: ubuntu-26.04 defaults to gcc 15 (C++26-capable).
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.5

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          runVcpkgInstall: true
          doNotCache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      - name: Configure
        run: cmake --preset release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (traced by CodeQL)
        run: cmake --build --preset release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
