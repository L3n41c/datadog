name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # Artifacts and the Actions cache use the runtime token (ACTIONS_RUNTIME_TOKEN),
  # which is not governed by this block; actions: read is enough for cache lookups.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler.name }} / ${{ matrix.preset }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Unversioned compiler names: on ubuntu-26.04 the defaults are gcc 15 and
        # clang 21, which satisfy the C++26 requirement (GCC >= 15, Clang >= 19).
        # They track the runner image default, so bumping runs-on is enough.
        # Note: Dependabot only updates 'uses:' action refs, never these strings.
        compiler:
          - name: gcc
            cc: gcc
            cxx: g++
          - name: clang
            cc: clang
            cxx: clang++
        preset:
          - dev
          - dev-tsan
          - release
          - coverage
          - fuzzer
        exclude:
          # The fuzzer preset requires clang++ (-fsanitize=fuzzer-no-link is Clang-only).
          - compiler:
              name: gcc
            preset: fuzzer
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.5

      - name: Set up vcpkg (manifest mode + GHA binary caching)
        uses: lukka/run-vcpkg@v11.6
        with:
          # Run `vcpkg install` now; cache the vcpkg tool and enable the GHA binary cache.
          runVcpkgInstall: true
          doNotCache: false

      # gcovr is required by the 'coverage' CMake target at configure time
      # (find_program check in cmake/Coverage.cmake), so install it before
      # configuring on the GCC coverage leg.
      - name: Set up Python for gcovr
        if: matrix.preset == 'coverage' && matrix.compiler.name == 'gcc'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install gcovr (pinned in requirements-coverage.txt, updated by Dependabot)
        if: matrix.preset == 'coverage' && matrix.compiler.name == 'gcc'
        run: python -m pip install -r .github/requirements-coverage.txt

      - name: Install Datadog CI CLI
        if: matrix.preset != 'release'
        # An installation failure must not prevent the tests from running.
        # The upload step will surface it separately if credentials are available.
        continue-on-error: true
        run: npm install -g @datadog/datadog-ci

      # One command runs the whole workflow preset of the same name
      # (CMakePresets.json): configure + build + test. The coverage workflow
      # preset additionally runs the coverage_reset and coverage_report
      # targets around the test step (through the coverage-reset /
      # coverage-report build presets, since workflow steps cannot select
      # targets directly). release has no test step (BUILD_TESTING=OFF).
      # Test presets write the JUnit report themselves (outputJUnitFile ->
      # build/<preset>/junit.xml) and carry --output-on-failure/--no-tests=error.
      # cmake --workflow takes no -D options: on first configure the compiler
      # comes from the CC/CXX env (set at job level, matching the compiler
      # vcpkg used; the fuzzer preset pins clang++ itself, consistent with its
      # clang-only matrix leg) and the toolchain file from CMAKE_TOOLCHAIN_FILE.
      - name: Run workflow preset '${{ matrix.preset }}'
        id: workflow
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
        run: cmake --workflow --preset ${{ matrix.preset }}

      # After the workflow step so that steps.workflow is defined (actionlint
      # only allows referencing step ids declared earlier in the job).
      # release produces no JUnit report (no test step), hence the preset check.
      # ctest writes the JUnit report even when tests fail, and cmake
      # --workflow then exits non-zero, so upload on success OR failure.
      - name: Upload JUnit report to Datadog
        if: >-
          matrix.preset != 'release' &&
          !cancelled() &&
          (steps.workflow.outcome == 'success' || steps.workflow.outcome == 'failure')
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ vars.DD_SITE }}
          DD_ENV: ci
          DD_TAGS: "test.configuration:${{ matrix.compiler.name }}-${{ matrix.preset }}"
          JUNIT_REPORT: ${{ github.workspace }}/build/${{ matrix.preset }}/junit.xml
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "::notice::Datadog upload skipped: DD_API_KEY is unavailable; ingestion is unverified."
            exit 0
          fi
          if [ -z "$DD_SITE" ]; then
            echo "::error::Datadog upload failed: the DD_SITE Actions variable is unavailable."
            exit 1
          fi
          if [ ! -s "$JUNIT_REPORT" ]; then
            echo "::error::Datadog upload failed: no non-empty JUnit report was produced."
            exit 1
          fi
          datadog-ci junit upload --service datadog "$JUNIT_REPORT"

      - name: Upload coverage report to Datadog
        # Fork PRs do not receive the repository's API key. cmake --workflow
        # stops at the first failing step, and the coverage report is the last
        # step of the coverage workflow preset, so the report exists only when
        # the whole workflow succeeded (a plain if would be equivalent here,
        # but steps.workflow.outcome == 'success' states it explicitly).
        if: >-
          matrix.preset == 'coverage' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          !cancelled() &&
          steps.workflow.outcome == 'success'
        uses: DataDog/coverage-upload-github-action@v1
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          site: ${{ vars.DD_SITE }}
          files: ${{ matrix.compiler.name == 'gcc' && 'build/coverage/coverage.xml' || 'build/coverage/coverage.lcov' }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.compiler.name }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing
          retention-days: 7
          if-no-files-found: ignore
