name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # Artifacts and the Actions cache use the runtime token, not GITHUB_TOKEN scopes.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler.name }} / ${{ matrix.preset }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Unversioned names track the ubuntu-26.04 defaults (gcc 15 / clang 21,
        # C++26-capable). Dependabot only rewrites 'uses:' refs, never these.
        compiler:
          - name: gcc
            cc: gcc
            cxx: g++
          - name: clang
            cc: clang
            cxx: clang++
        preset:
          - dev
          - dev-tsan
          - release
          - coverage
          - fuzzer
        exclude:
          # The fuzzer preset requires clang++ (-fsanitize=fuzzer-no-link is Clang-only).
          - compiler:
              name: gcc
            preset: fuzzer
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Install CMake
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a  # v4.4.5

      - name: Set up vcpkg (manifest mode + GHA binary caching)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          # Install the dependencies now and enable the GHA binary cache.
          runVcpkgInstall: true
          doNotCache: false

      # gcovr is required at configure time (find_program in cmake/Coverage.cmake),
      # so install it before configuring the GCC coverage leg.
      - name: Set up Python for gcovr
        if: matrix.preset == 'coverage' && matrix.compiler.name == 'gcc'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.x'

      - name: Install gcovr (pinned in requirements-coverage.txt, updated by Dependabot)
        if: matrix.preset == 'coverage' && matrix.compiler.name == 'gcc'
        run: python -m pip install -r .github/requirements-coverage.txt

      # One command per matrix leg: the workflow preset of the same name runs
      # configure + build + test (coverage additionally runs the coverage_reset
      # and coverage_report targets around the test step, via the coverage-reset
      # / coverage-report build presets). release has no test step
      # (BUILD_TESTING=OFF). cmake --workflow takes no -D options, so on first
      # configure the compiler comes from the CC/CXX env and the toolchain file
      # from CMAKE_TOOLCHAIN_FILE.
      - name: Run workflow preset '${{ matrix.preset }}'
        id: workflow
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
        run: cmake --workflow --preset ${{ matrix.preset }}

      # steps.<id> must be declared earlier in the job (actionlint). release
      # produces no JUnit report (no test step). ctest writes the JUnit report
      # even when tests fail, so upload on success OR failure.
      - name: Upload JUnit report to Datadog
        if: >-
         matrix.preset != 'release' &&
         (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
         !cancelled() &&
          (steps.workflow.outcome == 'success' || steps.workflow.outcome == 'failure')
        uses: DataDog/junit-upload-github-action@cdbf0b0acda1005e45c4a11d445bf3dde78e796f  # v4
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          site: ${{ vars.DD_SITE }}
          service: datadog
          files: ${{ github.workspace }}/build/${{ matrix.preset }}/junit.xml
          env: ci
          tags: "test.configuration:${{ matrix.compiler.name }}-${{ matrix.preset }}"

      - name: Upload coverage report to Datadog
        # Fork PRs do not receive the repository's API key. cmake --workflow
        # stops at the first failing step, so the report exists only when the
        # whole workflow succeeded.
        if: >-
          matrix.preset == 'coverage' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          !cancelled() &&
          steps.workflow.outcome == 'success'
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77  # v1
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          site: ${{ vars.DD_SITE }}
          files: ${{ matrix.compiler.name == 'gcc' && 'build/coverage/coverage.xml' || 'build/coverage/coverage.lcov' }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: test-logs-${{ matrix.compiler.name }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing
          retention-days: 7
          if-no-files-found: ignore
