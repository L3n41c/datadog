version: 2
registries:
  github-private:
    type: git
    url: https://github.com
    username: L3n41c
    password: ${{ secrets.GH_PAT }}

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "daily"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    registries:
      - github-private
    schedule:
      interval: "daily"

  - package-ecosystem: "vcpkg"
    directory: "/"
    schedule:
      interval: "daily"
